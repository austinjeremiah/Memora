[project]
name = "memora"
version = "0.1.0"
description = "Persistent clinical memory + deterministic safety gate, on Sibyl Memory"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sibyl-memory-client>=0.7.0",
    "openai>=1.54,<4",
    "web3>=7.5",
    "eth-account>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["memora*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exercises a real on-disk Sibyl store",
    "compliance: hackathon gate-criterion checks",
    "llm: makes a real call to the configured model provider",
    "chain: sends a real transaction to Base Sepolia (costs testnet gas)",
]
